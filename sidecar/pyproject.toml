[project]
name = "gliner-sidecar"
version = "0.1.0"
description = "Contextual PII Extraction Sidecar using GLiNER-small"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "gliner>=0.2.0",
    "pydantic>=2.6.0",
    "torch>=2.0.0",
    "uvicorn[standard]>=0.28.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]

[tool.uv]
# Application (not a package): uv sync manages dependencies only.
package = false

# CPU-only torch: keeps the sidecar image small — no CUDA wheels.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
