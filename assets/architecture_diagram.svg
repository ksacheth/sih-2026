<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" />
      <stop offset="100%" stop-color="#0d1322" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bgGrad)" rx="12" />
  <rect width="898" height="498" x="1" y="1" fill="none" stroke="#1e293b" stroke-width="2" rx="12" />

  <!-- Title Header -->
  <text x="450" y="40" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Privacy Lens — System Architecture &amp; Data Pipeline
  </text>
  <text x="450" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    DPDP Act 2023 Compliant • Zero-Knowledge Hard Privacy Boundary • Deterministic-First Engine
  </text>

  <!-- Box 1: User Profile -->
  <g transform="translate(40, 100)">
    <rect width="220" height="110" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" rx="8" />
    <text x="110" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#06b6d4" text-anchor="middle">1. Monitored Profile</text>
    <text x="110" y="55" font-family="sans-serif" font-size="12" fill="#cbd5e1" text-anchor="middle">Attested &amp; OTP Identifiers</text>
    <text x="110" y="75" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Email • Phone • Name</text>
    <text x="110" y="90" font-family="sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Username • Org • Location</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 260 155 L 320 155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4" />

  <!-- Box 2: Connectors & PII Extraction -->
  <g transform="translate(330, 100)">
    <rect width="240" height="110" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="1.5" rx="8" />
    <text x="120" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#60a5fa" text-anchor="middle">2. Discovery &amp; Extraction</text>
    <text x="120" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Serper Web • ExposedOrNot Index</text>
    <text x="120" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">GLiNER NER Sidecar (gliner_small)</text>
    <text x="120" y="88" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Regex + Checksum Rule Engine</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 570 155 L 630 155" stroke="#38bdf8" stroke-width="2" />

  <!-- Box 3: Entity Resolution Engine -->
  <g transform="translate(640, 100)">
    <rect width="220" height="110" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" rx="8" />
    <text x="110" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#fb7185" text-anchor="middle">3. Entity Resolution</text>
    <text x="110" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Token Normalization &amp; Initials</text>
    <text x="110" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Top-100 Common Name Penalty</text>
    <text x="110" y="88" font-family="sans-serif" font-size="10" font-weight="700" fill="#f43f5e" text-anchor="middle">THE HARD RULE GUARD</text>
  </g>

  <!-- Arrow 3 -> 4 (Down) -->
  <path d="M 750 210 L 750 270" stroke="#f43f5e" stroke-width="2" />

  <!-- Box 4: Rules & Threat Matrix -->
  <g transform="translate(640, 280)">
    <rect width="220" height="120" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" rx="8" />
    <text x="110" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#c084fc" text-anchor="middle">4. Rules &amp; Threat Matrix</text>
    <text x="110" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Deterministic Score (0.00-0.98)</text>
    <text x="110" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Threat Categorization &amp; Rank</text>
    <text x="110" y="88" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">data/brokers.json Opt-Outs</text>
  </g>

  <!-- Arrow 4 -> 5 (Left) -->
  <path d="M 640 340 L 580 340" stroke="#c084fc" stroke-width="2" />

  <!-- Box 5: Redacted LLM Layer -->
  <g transform="translate(330, 280)">
    <rect width="240" height="120" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" rx="8" />
    <text x="120" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#34d399" text-anchor="middle">5. Redacted LLM Layer</text>
    <text x="120" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">100% PII Stripping (Redactor)</text>
    <text x="120" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Dual SDK (Gemini / Groq)</text>
    <text x="120" y="88" font-family="sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Deterministic Template Fallback</text>
  </g>

  <!-- Arrow 5 -> 6 (Left) -->
  <path d="M 330 340 L 270 340" stroke="#34d399" stroke-width="2" />

  <!-- Box 6: Dashboard UI -->
  <g transform="translate(40, 280)">
    <rect width="220" height="120" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.5" rx="8" />
    <text x="110" y="30" font-family="sans-serif" font-size="14" font-weight="700" fill="#22d3ee" text-anchor="middle">6. Dashboard Workspace</text>
    <text x="110" y="52" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Confirmed vs Potential Cards</text>
    <text x="110" y="70" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Actionable Remediation Center</text>
    <text x="110" y="88" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Direct Data Broker Opt-Out Links</text>
  </g>

  <!-- Footer Banner -->
  <rect x="40" y="440" width="820" height="35" fill="#0f172a" stroke="#1e293b" rx="6" />
  <text x="450" y="462" font-family="sans-serif" font-size="12" font-weight="600" fill="#38bdf8" text-anchor="middle">
    Benchmark Results: 100% Decoy Pass Rate (9/9 Decoys, 0 False Confirmed Alerts) • 43 Corpus Files Evaluated
  </text>
</svg>