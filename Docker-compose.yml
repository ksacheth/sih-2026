services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    # Single-node replica set: multi-document transactions (account erasure,
    # identifier deletion) fail on a standalone mongod.
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      # Loopback only — the image starts with no auth configured.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Healthy only once the set has a writable primary; initiates the set
      # on first boot. Retries give the single-node election time to finish.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { db.hello().isWritablePrimary ? quit(0) : rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); } catch (e) {} quit(1)"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 15s

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./scripts/init-mongo.js:/scripts/init-mongo.js:ro
    entrypoint: ["mongosh", "--quiet", "mongodb://mongo:27017/exposure_monitor", "/scripts/init-mongo.js"]

  sidecar:
    build:
      context: .
      dockerfile: sidecar/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      sidecar:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://mongo:27017/exposure_monitor
      MONGO_DB_NAME: exposure_monitor
      SIDECAR_URL: http://sidecar:8000
      FIXTURES: ${FIXTURES:-1}
      HMAC_SECRET: ${HMAC_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_RESEND_KEY: ${AUTH_RESEND_KEY:-}
      AUTH_RESEND_FROM: ${AUTH_RESEND_FROM:-onboarding@example.com}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  mongo_data: